# Published results for the platelet datasets, from the PubMed abstracts (retrieved 2026-11-05).
# Cohort definitions in the papers differ from the GEO table splits used here, so these are
# reference points, not like-for-like comparisons.
GSE89843:
  citation: "Best MG et al. Swarm Intelligence-Enhanced Detection of Non-Small-Cell Lung Cancer Using Tumor-Educated Platelets. Cancer Cell 2017;32(2):238-252.e9"
  doi: 10.1016/j.ccell.2017.07.004
  pmid: "28810146"
  method: "particle-swarm-optimized SVM on platelet RNA-seq"
  results:
    - {cohort: "late-stage validation", n: 518, auc: 0.94, auc_lo: 0.92, auc_hi: 0.96, accuracy: 0.88}
    - {cohort: "early-stage validation", n: 106, auc: 0.89, auc_lo: 0.83, auc_hi: 0.95, accuracy: 0.81}
GSE68086:
  citation: "Best MG et al. RNA-Seq of Tumor-Educated Platelets Enables Blood-Based Pan-Cancer, Multiclass, and Molecular Pathway Cancer Diagnostics. Cancer Cell 2015;28(5):666-676"
  doi: 10.1016/j.ccell.2015.09.018
  pmid: "26525104"
  method: "SVM on platelet RNA-seq"
  results:
    - {task: pancancer_vs_healthy, n: 283, accuracy: 0.96}
    - {task: cancer_type, n_types: 6, accuracy: 0.71}
