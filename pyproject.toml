[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genepanel"
version = "0.1.0"
description = "How small can a gene-expression panel get before cancer detection degrades?"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "pyarrow", "scikit-learn>=1.4", "xgboost>=2.0", "shap",
  "gseapy", "matplotlib", "seaborn", "pyyaml", "requests", "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "nbconvert", "ipykernel"]

[project.scripts]
genepanel = "genepanel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
