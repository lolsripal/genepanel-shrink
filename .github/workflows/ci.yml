name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests (synthetic data, includes a leakage check)
        run: pytest -q
      - name: End-to-end smoke run (synthetic data, no downloads)
        run: genepanel all --config config/ci.yaml
