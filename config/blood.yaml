# Chapter 2 (blood test): tumor-educated platelet RNA from a blood draw (Best et al.).
# Raw counts -> log2(CPM+1). 8 datasets x 5x5 CV. ~30-45 min on 8 cores.
seed: 42
data_dir: data
results_dir: results/blood
pipeline: [download, run, analyze, confounding, biology, report]

datasets:
  - {source: platelets, study: GSE89843, task: nsclc_vs_healthy, pubmed_term: lung cancer}
  - {source: platelets, study: GSE89843, task: nsclc_vs_noncancer, pubmed_term: lung cancer}
  - {source: platelets, study: GSE89843, task: nonmetastatic_vs_noncancer, pubmed_term: lung cancer}
  # confounding checks: one hospital with both classes; the authors' age/sex/smoking-matched cohort
  - {source: platelets, study: GSE89843, name: GSE89843_VUMC, hospital: VUMC, task: nsclc_vs_noncancer, pubmed_term: lung cancer}
  - {source: platelets, study: GSE89843, name: GSE89843_matched, cohort: matched_cohort, task: nsclc_vs_noncancer, pubmed_term: lung cancer}
  - {source: platelets, study: GSE68086, task: pancancer_vs_healthy, pubmed_term: cancer,
     overrides: {preprocess: {min_frac_expressed: 0.5}}}
  # healthy controls exist only in batches 02-04: rerun inside those batches
  - {source: platelets, study: GSE68086, name: GSE68086_batch234, batches: [Batch02, Batch03, Batch04], task: pancancer_vs_healthy, pubmed_term: cancer,
     overrides: {preprocess: {min_frac_expressed: 0.5}}}
  - {source: platelets, study: GSE68086, task: cancer_type, pubmed_term: cancer,
     overrides: {preprocess: {min_frac_expressed: 0.5}}}

preprocess:
  min_expr: 1.0          # log2(CPM+1) > 1  <=>  CPM > 1
  min_frac_expressed: 0.2
  min_std: 0.1

cv: {n_splits: 5, n_repeats: 5, n_jobs: 8}

selection:
  prefilter_k: 2000
  selectors: [univariate, variance, lasso, mutual_info, rfe, shap, stability]
  stability_subsamples: 50
  panel_sizes: [500, 100, 50, 20, 10, 5, 2, 1]
  rfe_drop_frac: 0.1

models: [logreg, rf, xgb, mlp]
random_baseline: {n_draws: 20, models: [logreg]}
prediction_models: [logreg]

analysis: {delta_auc: 0.01, consensus_freq: 0.8, sens_target: 0.9}
